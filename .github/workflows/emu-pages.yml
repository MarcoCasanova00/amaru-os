name: emulator pages

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate firmware tables
        run: python3 tools/gen_bunker_library.py
        working-directory: firmware
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v2
        with:
          version: latest
      - name: Build WebAssembly emulator
        run: EMU_PREVIEW=0 sh web/emu/build.sh
        working-directory: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: emu
          path: firmware/build/emu

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emu
          path: docs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          source: [branch: gh-pages]
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
